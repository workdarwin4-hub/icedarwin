<!DOCTYPE html>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Characters Roster
const CHARACTERS = [
  {

    badge: 'الأساسي ⭐',
    isMain: true
  },
  {
    id: 'abyusif',
    name: 'ابيوسف',
    role: 'تيشيرت DAR & شنطة',
    badge: null,
    isMain: false
  },
  {
    id: 'seif',
    name: 'سيف',
    role: 'سويت شيرت أسود',
    badge: null,
    isMain: false
  },
  {
    id: 'youssef_hamada',
    name: 'يوسف حماده',
    role: 'كاب أسود & أبيض',
    badge: null,
    isMain: false
  }
];

let selectedCharId = localStorage.getItem('icy_selected_char') || 'darwin';

// Retro Arcade Sound Synthesizer
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type, pitchMod = 1) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'select') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
      osc.start(now);
      osc.stop(now + 0.09);
    } else if (type === 'jump') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(210 * pitchMod, now);
      osc.frequency.exponentialRampToValueAtTime(510 * pitchMod, now + 0.13);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
      osc.start(now);
      osc.stop(now + 0.14);
    } else if (type === 'combo') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(420 * pitchMod, now);
      osc.frequency.setValueAtTime(630 * pitchMod, now + 0.06);
      osc.frequency.setValueAtTime(880 * pitchMod, now + 0.12);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'season') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.linearRampToValueAtTime(680, now + 0.3);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'gameover') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(65, now + 0.45);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.48);
      osc.start(now);
      osc.stop(now + 0.48);
    }
  } catch (e) {}
}

let W = 480, H = 800;
function resize() {
  const wrapper = document.getElementById('game-wrapper');
  W = wrapper.clientWidth;
  H = wrapper.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Classic Icy Tower Brick Wall & Platform Themes per Weather
const SEASONS = [
  {
    id: 'summer',
    minFloor: 0,
    name: '☀️ الصيف (جو حر)',
    banner: '☀️ الصيف الحار - ابدأ الصعود!',
    brickBg: '#2e241f',
    brickFill: '#4a382e',
    brickHighlight: '#634b3e',
    wallFill: '#5c4332',
    wallEdge: '#805e46',
    platBase: '#8c6239',
    platTop: '#f1c40f',
    friction: 0.84,
    gravity: 0.58
  },
  {
    id: 'autumn',
    minFloor: 50,
    name: '🍂 الخريف',
    banner: '🍂 دخلنا الخريف - أوراق الشجر!',
    brickBg: '#261a1d',
    brickFill: '#3d282c',
    brickHighlight: '#57393f',
    wallFill: '#4d2d25',
    wallEdge: '#734337',
    platBase: '#6e352c',
    platTop: '#e67e22',
    friction: 0.85,
    gravity: 0.60
  },
  {
    id: 'rain',
    minFloor: 100,
    name: '🌧️ أمطار غزيرة',
    banner: '🌧️ الجو بيمطر - الأرض مبلولة!',
    brickBg: '#181c24',
    brickFill: '#272e3b',
    brickHighlight: '#364052',
    wallFill: '#2c3545',
    wallEdge: '#435169',
    platBase: '#4b6584',
    platTop: '#778ca3',
    friction: 0.91,
    gravity: 0.62
  },
  {
    id: 'snow',
    minFloor: 150,
    name: '❄️ عاصفة ثلجية',
    banner: '❄️ تلج! استايل آيس تاور الأصلي!',
    brickBg: '#1b1926',
    brickFill: '#2d2a3e',
    brickHighlight: '#3f3b57',
    wallFill: '#35324a',
    wallEdge: '#524d73',
    platBase: '#8395a7',
    platTop: '#ffffff',
    friction: 0.955,
    gravity: 0.63
  },
  {
    id: 'storm',
    minFloor: 220,
    name: '⚡ عاصفة البرق',
    banner: '⚡ مستوى الوحوش - برق وسرعة!',
    brickBg: '#110e1b',
    brickFill: '#1e1930',
    brickHighlight: '#2e264a',
    wallFill: '#241e38',
    wallEdge: '#483d70',
    platBase: '#341f97',
    platTop: '#a55eea',
    friction: 0.93,
    gravity: 0.66
  }
];

let gameState = 'START';
let score = 0;
let bestScore = parseInt(localStorage.getItem('icy_darwin_crew_best') || '0');
document.getElementById('best-val').innerText = bestScore;

let cameraY = 0;
let autoScrollSpeed = 0;
let currentSeasonIndex = 0;
let difficultyLevel = 1;
let platforms = [];
let particles = [];
let floatingTexts = [];
let lightningFlash = 0;

// Player Object (Chunky Icy Tower Proportions)
const player = {
  x: W / 2,
  y: H - 110,
  w: 44,
  h: 68,
  vx: 0,
  vy: 0,
  grounded: false,
  facing: 1,
  spinAngle: 0,
  isSpinning: false,
  lastFloor: 0,
  comboCount: 0,
  comboTimer: 0,
  maxComboTime: 180,
  walkFrame: 0
};

const keys = { left: false, right: false, jump: false };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!keys.jump) triggerJump();
    keys.jump = true;
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

function bindTouch(id, keyName, isJump = false) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    keys[keyName] = true;
    if (isJump) triggerJump();
  }, { passive: false });
  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys[keyName] = false;
  }, { passive: false });
  el.addEventListener('mousedown', () => {
    keys[keyName] = true;
    if (isJump) triggerJump();
  });
  el.addEventListener('mouseup', () => keys[keyName] = false);
  el.addEventListener('mouseleave', () => keys[keyName] = false);
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'jump', true);

function triggerJump() {
  if (gameState !== 'PLAYING') return;
  if (player.grounded) {
    const speedBonus = Math.abs(player.vx) * 0.7;
    player.vy = -(13.0 + speedBonus);
    player.grounded = false;

    if (Math.abs(player.vx) > 5.6) {
      player.isSpinning = true;
      player.spinAngle = 0;
      playSound('jump', 1.35);
    } else {
      player.isSpinning = false;
      playSound('jump', 1.0);
    }
  }
}

const WALL_WIDTH = 28;
const FLOOR_GAP = 95;

function createPlatform(floorNum) {
  const y = H - 55 - floorNum * FLOOR_GAP;
  if (floorNum === 0) {
    return {
      floor: 0,
      x: WALL_WIDTH,
      y: y,
      w: W - WALL_WIDTH * 2,
      h: 24,
      vx: 0,
      isMilestone: true
    };
  }

  const shrink = Math.min(95, floorNum * 0.35);
  const minW = Math.max(82, 140 - shrink);
  const maxW = Math.max(120, 225 - shrink);
  const isMilestone = floorNum % 50 === 0;

  const w = isMilestone ? (W - WALL_WIDTH * 2) : (minW + Math.random() * (maxW - minW));
  const minX = WALL_WIDTH + 6;
  const maxX = W - WALL_WIDTH - w - 6;
  const x = isMilestone ? WALL_WIDTH : (minX + Math.random() * Math.max(10, maxX - minX));

  let vx = 0;
  if (!isMilestone && floorNum > 25 && Math.random() < Math.min(0.45, floorNum / 400)) {
    vx = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.min(3.2, floorNum / 90));
  }

  return { floor: floorNum, x, y, w, h: 20, vx, isMilestone };
}

function initParticles(seasonId) {
  particles = [];
  const count = seasonId === 'rain' || seasonId === 'storm' ? 95 : (seasonId === 'snow' ? 80 : (seasonId === 'autumn' ? 28 : 16));
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speedY: (seasonId === 'rain' || seasonId === 'storm') ? (11 + Math.random() * 6) : (1.5 + Math.random() * 2.5),
      speedX: (seasonId === 'rain' || seasonId === 'storm') ? -2 : (Math.random() * 2 - 1),
      size: (seasonId === 'rain' || seasonId === 'storm') ? 13 : (3 + Math.random() * 4),
      angle: Math.random() * Math.PI * 2
    });
  }
}

function showBanner(text) {
  const banner = document.getElementById('season-banner');
  banner.innerText = text;
  banner.style.opacity = '1';
  banner.style.transform = 'translate(-50%, -50%) scale(1)';
  setTimeout(() => {
    banner.style.opacity = '0';
    banner.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, 2400);
}

function resetGame() {
  score = 0;
  cameraY = 0;
  autoScrollSpeed = 0;
  currentSeasonIndex = 0;
  difficultyLevel = 1;
  platforms = [];
  floatingTexts = [];

  for (let i = 0; i < 20; i++) {
    platforms.push(createPlatform(i));
  }

  player.x = W / 2 - player.w / 2;
  player.y = H - 55 - player.h;
  player.vx = 0;
  player.vy = 0;
  player.grounded = true;
  player.facing = 1;
  player.spinAngle = 0;
  player.isSpinning = false;
  player.lastFloor = 0;
  player.comboCount = 0;
  player.comboTimer = 0;

  initParticles('summer');
  updateHUD();
  showBanner(SEASONS[0].banner);
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  resetGame();
  gameState = 'PLAYING';
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('change-char-btn').addEventListener('click', () => {
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  gameState = 'START';
});

function updateSeasonAndDifficulty() {
  let newSeasonIdx = 0;
  for (let i = SEASONS.length - 1; i >= 0; i--) {
    if (player.lastFloor >= SEASONS[i].minFloor) {
      newSeasonIdx = i;
      break;
    }
  }
  if (newSeasonIdx !== currentSeasonIndex) {
    currentSeasonIndex = newSeasonIdx;
    initParticles(SEASONS[currentSeasonIndex].id);
    showBanner(SEASONS[currentSeasonIndex].banner);
    playSound('season');
  }
  difficultyLevel = 1 + Math.floor(score / 1500);
}

function updateHUD() {
  document.getElementById('score-val').innerText = score;
  document.getElementById('floor-val').innerText = player.lastFloor;
  document.getElementById('weather-name').innerText = SEASONS[currentSeasonIndex].name;

  const activeChar = CHARACTERS.find(c => c.id === selectedCharId) || CHARACTERS[0];
  document.getElementById('active-char-hud').innerText = (activeChar.isMain ? '⭐ ' : '🎮 ') + activeChar.name;

  const diffLabels = ['عادي', 'متوسط', 'سريع', 'صعب', 'جنوني', 'مستحيل'];
  const label = diffLabels[Math.min(diffLabels.length - 1, difficultyLevel - 1)];
  document.getElementById('level-name').innerText = `صعوبة ${difficultyLevel} (${label})`;

  const comboBox = document.getElementById('combo-container');
  if (player.comboCount >= 2 && player.comboTimer > 0) {
    comboBox.style.opacity = '1';
    document.getElementById('combo-text').innerText = `COMBO x${player.comboCount}!`;
    document.getElementById('combo-bar').style.width = `${(player.comboTimer / player.maxComboTime) * 100}%`;
  } else {
    comboBox.style.opacity = '0';
  }
}

function addFloatingText(text, x, y, color = '#ffdd59') {
  floatingTexts.push({ text, x, y, color, alpha: 1, vy: -1.5 });
}

function update() {
  if (gameState !== 'PLAYING') return;

  const season = SEASONS[currentSeasonIndex];
  const accel = player.grounded ? (season.id === 'snow' ? 0.55 : 0.95) : 0.72;
  const maxSpeed = 8.8;

  if (keys.left) {
    player.vx -= accel;
    player.facing = -1;
  }
  if (keys.right) {
    player.vx += accel;
    player.facing = 1;
  }

  if (!keys.left && !keys.right) {
    player.vx *= player.grounded ? season.friction : 0.96;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  if (player.vx > maxSpeed) player.vx = maxSpeed;
  if (player.vx < -maxSpeed) player.vx = -maxSpeed;

  player.x += player.vx;

  if (player.x < WALL_WIDTH) {
    player.x = WALL_WIDTH;
    player.vx = Math.abs(player.vx) * 0.85;
    player.facing = 1;
  } else if (player.x + player.w > W - WALL_WIDTH) {
    player.x = W - WALL_WIDTH - player.w;
    player.vx = -Math.abs(player.vx) * 0.85;
    player.facing = -1;
  }

  const prevBottom = player.y + player.h;
  player.vy += season.gravity;
  player.y += player.vy;

  if (player.isSpinning) {
    player.spinAngle += 0.28 * player.facing;
  } else {
    player.spinAngle = 0;
  }

  if (player.grounded && Math.abs(player.vx) > 0.5) {
    player.walkFrame += Math.abs(player.vx) * 0.055;
  } else {
    player.walkFrame = 0;
  }

  for (let p of platforms) {
    if (p.vx !== 0) {
      p.x += p.vx;
      if (p.x <= WALL_WIDTH + 4 || p.x + p.w >= W - WALL_WIDTH - 4) {
        p.vx *= -1;
      }
    }
  }

  player.grounded = false;
  if (player.vy >= 0) {
    for (let p of platforms) {
      const currBottom = player.y + player.h;
      const withinX = (player.x + player.w - 6 > p.x) && (player.x + 6 < p.x + p.w);
      if (withinX && prevBottom <= p.y + 10 && currBottom >= p.y) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.isSpinning = false;
        player.x += p.vx;

        if (p.floor > player.lastFloor) {
          const jumpedFloors = p.floor - player.lastFloor;
          if (jumpedFloors >= 2) {
            player.comboCount += jumpedFloors;
            player.comboTimer = player.maxComboTime;
            const bonus = jumpedFloors * 35 * Math.max(1, Math.floor(player.comboCount / 2));
            score += bonus;

            const cheers = ['SWEET!', 'GOOD!', 'GREAT!', 'SUPER!', 'IM PAID! 🔥'];
            const word = cheers[Math.min(cheers.length - 1, Math.floor(player.comboCount / 3))];
            addFloatingText(`${word} +${bonus}`, player.x + player.w / 2, player.y - 18, '#ffdd59');
            playSound('combo', 1 + Math.min(0.6, player.comboCount * 0.04));
          } else {
            if (player.comboCount >= 2) finishCombo();
            score += 10;
          }
          player.lastFloor = p.floor;
          updateSeasonAndDifficulty();
        }
        break;
      }
    }
  }

  if (player.comboTimer > 0) {
    player.comboTimer--;
    if (player.comboTimer <= 0 && player.comboCount >= 2) finishCombo();
  }

  if (player.lastFloor >= 1) {
    const targetAutoSpeed = 0.85 + Math.min(3.6, (player.lastFloor * 0.012) + (score * 0.00012));
    autoScrollSpeed += (targetAutoSpeed - autoScrollSpeed) * 0.02;
    cameraY += autoScrollSpeed;
  }

  const screenY = player.y + cameraY;
  if (screenY < H * 0.36) {
    const diff = (H * 0.36) - screenY;
    cameraY += diff;
    score += Math.floor(diff * 0.25);
  }

  let highestFloor = platforms[platforms.length - 1].floor;
  while (H - 55 - highestFloor * FLOOR_GAP + cameraY > -200) {
    highestFloor++;
    platforms.push(createPlatform(highestFloor));
  }

  platforms = platforms.filter(p => (p.y + cameraY) < H + 120);

  for (let pt of particles) {
    pt.y += pt.speedY;
    pt.x += pt.speedX + Math.sin(pt.angle) * 0.5;
    pt.angle += 0.04;
    if (pt.y > H) { pt.y = -10; pt.x = Math.random() * W; }
    if (pt.x < 0) pt.x = W;
    if (pt.x > W) pt.x = 0;
  }

  if (season.id === 'storm' && Math.random() < 0.004) lightningFlash = 0.75;
  if (lightningFlash > 0) lightningFlash -= 0.05;

  for (let ft of floatingTexts) {
    ft.y += ft.vy;
    ft.alpha -= 0.018;
  }
  floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

  if (player.y + cameraY > H + 20) triggerGameOver();

  updateHUD();
}

function finishCombo() {
  const megaBonus = player.comboCount * 25;
  score += megaBonus;
  addFloatingText(`COMBO BONUS +${megaBonus}!`, W / 2, H / 2 - 40, '#2ed573');
  player.comboCount = 0;
  player.comboTimer = 0;
}

function triggerGameOver() {
  gameState = 'GAMEOVER';
  playSound('gameover');
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('icy_darwin_crew_best', bestScore);
    document.getElementById('best-val').innerText = bestScore;
  }
  const activeChar = CHARACTERS.find(c => c.id === selectedCharId) || CHARACTERS[0];
  document.getElementById('final-stats').innerText = `الشخصية: ${activeChar.name} | السكور: ${score} | طابق: ${player.lastFloor}`;
  document.getElementById('best-stats').innerText = `أعلى رقم قياسي: ${bestScore}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

    targetCtx.stroke();

    // Casual Pants
    targetCtx.fillStyle = '#3d3d45';
    targetCtx.beginPath();
    targetCtx.moveTo(-14, 11);
    targetCtx.lineTo(14, 11);
    targetCtx.lineTo(16 + legSwing * 0.5, 26);
    targetCtx.lineTo(3 + legSwing * 0.5, 26);
    targetCtx.lineTo(0, 19);
    targetCtx.lineTo(-3 - legSwing * 0.5, 26);
    targetCtx.lineTo(-15 - legSwing * 0.5, 26);
    targetCtx.closePath();
    targetCtx.fill();
    targetCtx.stroke();

    // Clean White T-Shirt
    targetCtx.fillStyle = '#ffffff';
    targetCtx.beginPath();
    targetCtx.roundRect(-18, -7, 36, 21, 9);
    targetCtx.fill();
    targetCtx.stroke();

    // Face
    targetCtx.fillStyle = '#d49a72';
    targetCtx.beginPath();
    targetCtx.arc(-14, -14, 4, 0, Math.PI * 2);
    targetCtx.arc(14, -14, 4, 0, Math.PI * 2);
    targetCtx.fill();
    targetCtx.stroke();

    targetCtx.beginPath();
    targetCtx.ellipse(0, -14, 14, 11, 0, 0, Math.PI * 2);
    targetCtx.fill();
    targetCtx.stroke();

    // Eyes
    targetCtx.fillStyle = '#000';
    targetCtx.beginPath();
    targetCtx.arc(-2, -15.5, 1.9, 0, Math.PI * 2);
    targetCtx.arc(7, -15.5, 1.9, 0, Math.PI * 2);
    targetCtx.fill();

    // Mustache & Chin Goatee (from his photo!)
    targetCtx.fillStyle = '#141414';
    targetCtx.beginPath();
    targetCtx.roundRect(-1.5, -11, 8.5, 2.1, 1);
    targetCtx.fill();
    targetCtx.beginPath();
    targetCtx.arc(2.5, -5.2, 4.4, 0, Math.PI);
    targetCtx.fill();

    // Curly Hair Fringe peeking under the cap
    targetCtx.fillStyle = '#111';
    targetCtx.beginPath();
    targetCtx.arc(-6, -20, 4, 0, Math.PI * 2);
    targetCtx.arc(0, -20.5, 4.2, 0, Math.PI * 2);
    targetCtx.arc(6, -20, 3.8, 0, Math.PI * 2);
    targetCtx.fill();

    // Black Baseball Cap + Forward Brim
    targetCtx.lineWidth = 3.2;
    targetCtx.fillStyle = '#18181d';
    targetCtx.beginPath();
    targetCtx.arc(0, -21, 14.5, Math.PI, 0);
    targetCtx.closePath();
    targetCtx.fill();
    targetCtx.stroke();

    // Cap Visor/Brim pointing forward
    targetCtx.fillStyle = '#111115';
    targetCtx.beginPath();
    targetCtx.roundRect(-2, -23.5, 22, 4.5, 2.5);
    targetCtx.fill();
    targetCtx.stroke();
  }

  targetCtx.restore();
}

// Build Character Selector Cards with Live Previews
function initCharacterMenu() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';

  CHARACTERS.forEach(char => {
    const card = document.createElement('div');
    card.className = 'char-card' + (char.id === selectedCharId ? ' selected' : '');
    card.dataset.id = char.id;

    if (char.badge) {
      const badge = document.createElement('div');
      badge.className = 'char-badge';
      badge.innerText = char.badge;
      card.appendChild(badge);
    }

    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = 76;
    previewCanvas.height = 88;
    previewCanvas.className = 'char-preview';
    const pCtx = previewCanvas.getContext('2d');
    pCtx.translate(38, 48);
    pCtx.scale(1.05, 1.05);
    drawCharacterSprite(pCtx, char.id, 1, 0, false, 0);

    const nameEl = document.createElement('div');
    nameEl.className = 'char-name';
    nameEl.innerText = char.name;

    const roleEl = document.createElement('div');
    roleEl.className = 'char-role';
    roleEl.innerText = char.role;

    card.appendChild(previewCanvas);
    card.appendChild(nameEl);
    card.appendChild(roleEl);

    card.addEventListener('click', () => {
      selectedCharId = char.id;
      localStorage.setItem('icy_selected_char', selectedCharId);
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      playSound('select');
      updateHUD();
    });

    grid.appendChild(card);
  });
}

// =========================================================================
// CLASSIC STONE BRICK BACKGROUND & ICY PLATFORMS RENDERER
// =========================================================================
function drawBrickBackground(season) {
  ctx.fillStyle = season.brickBg;
  ctx.fillRect(0, 0, W, H);

  const brickW = 68;
  const brickH = 34;
  const scrollOffset = (cameraY * 0.45) % (brickH * 2);

  for (let row = -2; row < Math.ceil(H / brickH) + 2; row++) {
    const y = row * brickH + scrollOffset;
    const isOdd = Math.abs(row) % 2 === 1;
    const xStart = isOdd ? -brickW / 2 : 0;

    for (let x = xStart; x < W; x += brickW) {
      ctx.fillStyle = season.brickFill;
      ctx.fillRect(x + 2, y + 2, brickW - 4, brickH - 4);

      ctx.fillStyle = season.brickHighlight;
      ctx.fillRect(x + 2, y + 2, brickW - 4, 3);
      ctx.fillRect(x + 2, y + 2, 3, brickH - 4);
    }
  }
}

function draw() {
  const season = SEASONS[currentSeasonIndex];

  // 1. Classic Dark Stone Brick Wall Background
  drawBrickBackground(season);

  // Lightning flash
  if (lightningFlash > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${lightningFlash})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 2. Side Tower Pillars
  ctx.fillStyle = season.wallFill;
  ctx.fillRect(0, 0, WALL_WIDTH, H);
  ctx.fillRect(W - WALL_WIDTH, 0, WALL_WIDTH, H);

  ctx.fillStyle = season.wallEdge;
  const pillarOffset = cameraY % 48;
  for (let y = pillarOffset - 48; y < H; y += 48) {
    ctx.fillRect(2, y, WALL_WIDTH - 6, 6);
    ctx.fillRect(W - WALL_WIDTH + 4, y + 24, WALL_WIDTH - 6, 6);
  }

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(WALL_WIDTH, 0);
  ctx.lineTo(WALL_WIDTH, H);
  ctx.moveTo(W - WALL_WIDTH, 0);
  ctx.lineTo(W - WALL_WIDTH, H);
  ctx.stroke();

  // 3. Classic Platforms + Wooden Floor Signs
  for (let p of platforms) {
    const drawY = p.y + cameraY;
    if (drawY < -40 || drawY > H + 40) continue;

    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000000';

    ctx.fillStyle = p.isMilestone ? '#27ae60' : season.platBase;
    ctx.beginPath();
    ctx.roundRect(p.x, drawY + 4, p.w, p.h - 4, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = p.isMilestone ? '#2ecc71' : season.platTop;
    ctx.beginPath();
    ctx.moveTo(p.x, drawY + 6);
    ctx.lineTo(p.x, drawY);
    ctx.lineTo(p.x + p.w, drawY);
    ctx.lineTo(p.x + p.w, drawY + 6);

    const toothWidth = 10;
    for (let tx = p.x + p.w; tx > p.x; tx -= toothWidth) {
      const nextX = Math.max(p.x, tx - toothWidth);
      const midX = (tx + nextX) / 2;
      ctx.lineTo(midX, drawY + 12);
      ctx.lineTo(nextX, drawY + 6);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if (p.floor > 0 && p.floor % 10 === 0) {
      const signW = 44;
      const signH = 18;
      const signX = p.x + p.w / 2 - signW / 2;
      const signY = drawY + p.h - 1;

      ctx.fillStyle = '#784820';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(signX, signY, signW, signH, 3);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#523014';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(signX + 3, signY + 6);
      ctx.lineTo(signX + signW - 3, signY + 6);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.floor, signX + signW / 2, signY + 13);
    }
  }

  // 4. Draw Selected Character
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h / 2 + cameraY);
  if (!player.isSpinning) {
    ctx.rotate(player.vx * 0.02);
  }
  drawCharacterSprite(ctx, selectedCharId, player.facing, player.walkFrame, player.isSpinning, player.spinAngle);
  ctx.restore();

  // 5. Weather Particles
  for (let pt of particles) {
    if (season.id === 'rain' || season.id === 'storm') {
      ctx.strokeStyle = 'rgba(130, 204, 221, 0.7)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      ctx.lineTo(pt.x - 3, pt.y + pt.size);
      ctx.stroke();
    } else if (season.id === 'snow') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else if (season.id === 'autumn') {
      ctx.fillStyle = '#e67e22';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, pt.size, pt.size * 0.5, pt.angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255, 221, 89, 0.45)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 6. Retro Outlined Combo Popups
  for (let ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = '900 22px Arial Black, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(ft.text, ft.x, ft.y + cameraY);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y + cameraY);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initCharacterMenu();
resetGame();
loop();
</script>
